[package]
name = "anticheat-daemon"
version = "0.1.0"
edition = "2021"
description = "AntiCheat Quiz Platform — Native Security Daemon"

[[bin]]
name = "anticheat-daemon"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
